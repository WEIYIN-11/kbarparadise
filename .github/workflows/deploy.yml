# 練功房部署 → Cloudflare Workers(取代搬家前的 Vercel git 整合)。
#
# 沒有 build:repo 根目錄就是站台。data/ 已納入版控(約 29 MB,單檔最大 6 MB,
# Workers 單檔上限 25 MiB),更新標的資料仍是 `npm run fetch` → commit → push。
#
# 不用 cloudflare/wrangler-action:它預設裝 wrangler 3.90,不支援 assets-only
# Worker(回 "Missing entry-point";2026-09-23 首次 CI 部署實測)。直接 npx 釘 4.x。
#
# 需要的 secrets:CLOUDFLARE_API_TOKEN(Workers Scripts:Edit + Zone DNS:Edit)、
# CLOUDFLARE_ACCOUNT_ID(Vatrade6666 帳號)。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
