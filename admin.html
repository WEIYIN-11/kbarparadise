<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練功房 — 後台管理</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAVLsvNmGxSrE7Qqko3txttsbUHDaPFCys",
  authDomain: "trianingground.firebaseapp.com",
  projectId: "trianingground",
  storageBucket: "trianingground.firebasestorage.app",
  messagingSenderId: "195611785724",
  appId: "1:195611785724:web:f07a404babe21d404b1a79"
};
const app = initializeApp(firebaseConfig);
window.fb = {
  auth: getAuth(app),
  db: getFirestore(app),
  provider: new GoogleAuthProvider(),
  signInWithPopup, onAuthStateChanged, signOut,
  doc, getDoc, setDoc, deleteDoc, collection, getDocs, serverTimestamp,
};
window.dispatchEvent(new Event('fb-ready'));
</script>

<style>
:root {
  --bg: #0a0e1a;
  --bg-2: #111827;
  --bg-3: #1f2937;
  --bg-4: #2a3441;
  --line: #2a3441;
  --text: #e5e7eb;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --accent: #10b981;
  --accent-2: #34d399;
  --danger: #ef4444;
  --danger-2: #f87171;
  --warn: #f59e0b;
  --info: #3b82f6;
  --gold: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
}
button, input, select {
  font-family: inherit; font-size: inherit; color: inherit;
  border: none; outline: none; background: none;
}
button { cursor: pointer; }

.topbar {
  height: 56px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 16px;
}
.brand {
  font-weight: 700; font-size: 16px;
  color: var(--accent-2);
  display: flex; align-items: center; gap: 6px;
}
.brand-tag {
  font-size: 11px; font-weight: 500;
  padding: 2px 6px; border-radius: 4px;
  background: var(--gold); color: #0a0e1a;
}
.nav-link {
  color: var(--text-2); font-size: 13px; text-decoration: none;
  padding: 6px 10px; border-radius: 6px;
}
.nav-link:hover { background: var(--bg-3); color: var(--text); }
.spacer { flex: 1; }
.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px;
  background: var(--bg-3);
  border-radius: 20px;
  font-size: 13px;
}
.user-chip img { width: 28px; height: 28px; border-radius: 50%; }

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.subtitle { color: var(--text-2); font-size: 13px; margin-bottom: 20px; }

.banner {
  padding: 14px 18px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 14px;
}
.banner.error { border-color: var(--danger); color: var(--danger-2); background: rgba(239,68,68,0.05); }
.banner.warn { border-color: var(--warn); color: var(--warn); background: rgba(245,158,11,0.05); }

.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 14px;
}
.card h3 {
  font-size: 14px; font-weight: 600;
  color: var(--text-2); margin-bottom: 10px;
}
.add-form {
  display: grid;
  grid-template-columns: 2fr 1.5fr 1fr auto;
  gap: 8px;
}
.add-form input, .add-form select {
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 11px;
  font-size: 13px;
  color: var(--text);
}
.add-form input:focus, .add-form select:focus { border-color: var(--accent); }
.btn-primary {
  padding: 9px 16px;
  background: var(--accent);
  color: #0a0e1a;
  font-weight: 600;
  border-radius: 6px;
  font-size: 13px;
}
.btn-primary:hover { background: var(--accent-2); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-danger {
  padding: 5px 10px;
  background: transparent;
  color: var(--danger-2);
  border-radius: 5px;
  font-size: 12px;
}
.btn-danger:hover { background: rgba(239,68,68,0.15); }
.btn-secondary {
  padding: 5px 10px;
  background: var(--bg-3);
  color: var(--text);
  border-radius: 5px;
  font-size: 12px;
}
.btn-secondary:hover { background: var(--bg-4); }
.btn-signin {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  background: #fff;
  color: #1f2937;
  border-radius: 8px;
  font-weight: 600;
}

table {
  width: 100%; border-collapse: collapse;
}
th, td {
  text-align: left; padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
th {
  color: var(--text-3); font-weight: 500; font-size: 12px;
  background: var(--bg-3);
}
tr:hover td { background: rgba(42,52,65,0.3); }
.pill {
  display: inline-block;
  padding: 2px 8px; border-radius: 4px; font-size: 11px;
  font-weight: 600;
}
.pill.admin { background: var(--gold); color: #0a0e1a; }
.pill.student { background: var(--bg-3); color: var(--text-2); }

.actions { display: flex; gap: 6px; }

#toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-2); border: 1px solid var(--line);
  padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0;
  transition: all 0.3s;
  z-index: 1000;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--accent); }
#toast.error { border-color: var(--danger); }

@media (max-width: 720px) {
  .add-form { grid-template-columns: 1fr; }
  table { font-size: 12px; }
  th, td { padding: 8px 6px; }
  th.hide-mobile, td.hide-mobile { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">📈 練功房 <span class="brand-tag">ADMIN</span></div>
  <a class="nav-link" href="/">回工具</a>
  <div class="spacer"></div>
  <div class="user-chip" id="user-chip" style="display:none;">
    <img id="user-avatar" alt="">
    <span id="user-name">—</span>
    <button class="btn-secondary" id="btn-signout" style="margin-left:4px;">登出</button>
  </div>
</div>

<div class="wrap">
  <h1>白名單管理</h1>
  <div class="subtitle">新增、移除學員 email，或變更角色</div>

  <div id="auth-banner" class="banner">檢查登入狀態中…</div>

  <div id="content" style="display:none;">

    <div class="card">
      <h3>+ 新增白名單</h3>
      <div class="add-form">
        <input type="email" id="new-email" placeholder="student@gmail.com（小寫）" autocomplete="off">
        <input type="text" id="new-name" placeholder="姓名（顯示用）" autocomplete="off">
        <select id="new-role">
          <option value="student">學員</option>
          <option value="admin">管理員</option>
        </select>
        <button class="btn-primary" id="btn-add">新增</button>
      </div>
      <div style="font-size:11px;color:var(--text-3);margin-top:8px;">
        ⚠️ 必須是學員真實的 Google 帳號 email（會自動小寫）
      </div>
    </div>

    <div class="card">
      <h3>目前白名單 <span id="count-tag" style="color:var(--text-3);font-weight:400;font-size:12px;margin-left:6px;"></span></h3>
      <div id="list-wrap" style="overflow-x:auto;">
        <div style="text-align:center;padding:30px;color:var(--text-3);">載入中…</div>
      </div>
    </div>

  </div>

  <div id="signin-section" style="display:none;text-align:center;padding:50px 20px;">
    <p style="color:var(--text-2);margin-bottom:20px;">請先登入</p>
    <button class="btn-signin" id="btn-google-signin">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google 登入
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = '';
  void t.offsetWidth;
  t.classList.add('show');
  if (kind) t.classList.add(kind);
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

let currentUser = null;
let isAdmin = false;
let entries = [];

async function init() {
  await new Promise(r => {
    if (window.fb) r(); else window.addEventListener('fb-ready', r, { once: true });
  });
  window.fb.onAuthStateChanged(window.fb.auth, async (user) => {
    if (!user) {
      $('auth-banner').style.display = 'none';
      $('signin-section').style.display = 'block';
      $('content').style.display = 'none';
      $('user-chip').style.display = 'none';
      return;
    }
    currentUser = user;
    $('user-chip').style.display = 'flex';
    $('user-avatar').src = user.photoURL || '';
    $('user-name').textContent = user.displayName || user.email;
    // Check admin
    const ref = window.fb.doc(window.fb.db, 'whitelist', user.email.toLowerCase());
    let snap;
    try {
      snap = await window.fb.getDoc(ref);
    } catch (e) {
      console.error(e);
      $('auth-banner').textContent = '無法讀取白名單：' + (e.message || e.code);
      $('auth-banner').className = 'banner error';
      return;
    }
    if (!snap.exists() || snap.data().role !== 'admin') {
      $('auth-banner').textContent = `${user.email} 不是管理員，無權使用此頁。`;
      $('auth-banner').className = 'banner error';
      $('signin-section').style.display = 'none';
      return;
    }
    isAdmin = true;
    $('auth-banner').style.display = 'none';
    $('signin-section').style.display = 'none';
    $('content').style.display = 'block';
    await loadList();
  });

  $('btn-google-signin').addEventListener('click', async () => {
    try {
      await window.fb.signInWithPopup(window.fb.auth, window.fb.provider);
    } catch (e) {
      toast('登入失敗：' + (e.message || e.code), 'error');
    }
  });
  $('btn-signout').addEventListener('click', async () => {
    await window.fb.signOut(window.fb.auth);
    location.reload();
  });

  $('btn-add').addEventListener('click', addEntry);
  $('new-email').addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
  $('new-name').addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
}

async function loadList() {
  const snap = await window.fb.getDocs(window.fb.collection(window.fb.db, 'whitelist'));
  entries = [];
  snap.forEach(d => entries.push({ email: d.id, ...d.data() }));
  entries.sort((a, b) => {
    // admin first, then by addedAt desc
    if ((a.role === 'admin') !== (b.role === 'admin')) return a.role === 'admin' ? -1 : 1;
    return (b.addedAt || '').localeCompare(a.addedAt || '');
  });
  renderList();
}

function renderList() {
  const wrap = $('list-wrap');
  if (!entries.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-3);">空白</div>';
    return;
  }
  $('count-tag').textContent = `共 ${entries.length} 人 · admin ${entries.filter(e => e.role === 'admin').length} 位`;
  let html = `<table><thead><tr>
    <th>Email</th>
    <th>姓名</th>
    <th>角色</th>
    <th class="hide-mobile">加入時間</th>
    <th></th>
  </tr></thead><tbody>`;
  for (const e of entries) {
    const isSelf = currentUser && e.email === currentUser.email.toLowerCase();
    const addedAt = e.addedAt ? new Date(e.addedAt).toLocaleString('zh-Hant', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    html += `<tr>
      <td>${esc(e.email)}${isSelf ? '<span class="pill admin" style="margin-left:6px;">你</span>' : ''}</td>
      <td>${esc(e.name || '—')}</td>
      <td><span class="pill ${e.role || 'student'}">${e.role === 'admin' ? '管理員' : '學員'}</span></td>
      <td class="hide-mobile" style="color:var(--text-3);">${esc(addedAt)}</td>
      <td class="actions">
        ${!isSelf ? `<button class="btn-secondary" data-toggle="${esc(e.email)}">${e.role === 'admin' ? '降為學員' : '升為管理員'}</button>
        <button class="btn-danger" data-delete="${esc(e.email)}">移除</button>` : '<span style="color:var(--text-3);font-size:11px;">不能修改自己</span>'}
      </td>
    </tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('[data-delete]').forEach(b =>
    b.addEventListener('click', () => deleteEntry(b.dataset.delete))
  );
  wrap.querySelectorAll('[data-toggle]').forEach(b =>
    b.addEventListener('click', () => toggleRole(b.dataset.toggle))
  );
}

async function addEntry() {
  const emailInput = $('new-email');
  const nameInput = $('new-name');
  const roleInput = $('new-role');
  const email = emailInput.value.trim().toLowerCase();
  const name = nameInput.value.trim();
  const role = roleInput.value;

  if (!email) { toast('請輸入 email', 'error'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('email 格式錯誤', 'error'); return; }
  if (entries.some(e => e.email === email)) { toast('該 email 已存在', 'error'); return; }

  $('btn-add').disabled = true;
  try {
    await window.fb.setDoc(
      window.fb.doc(window.fb.db, 'whitelist', email),
      { name: name || email.split('@')[0], role, addedAt: new Date().toISOString(), addedBy: currentUser.email }
    );
    emailInput.value = '';
    nameInput.value = '';
    roleInput.value = 'student';
    toast(`✓ 已新增 ${email}`, 'success');
    await loadList();
  } catch (e) {
    console.error(e);
    toast('新增失敗：' + (e.message || e.code), 'error');
  } finally {
    $('btn-add').disabled = false;
  }
}

async function deleteEntry(email) {
  if (!confirm(`確定移除 ${email}？\n\n他將立刻無法登入，但雲端資料保留（之後再加回來資料還在）。`)) return;
  try {
    await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'whitelist', email));
    toast(`已移除 ${email}`, 'success');
    await loadList();
  } catch (e) {
    console.error(e);
    toast('移除失敗：' + (e.message || e.code), 'error');
  }
}

async function toggleRole(email) {
  const entry = entries.find(e => e.email === email);
  if (!entry) return;
  const newRole = entry.role === 'admin' ? 'student' : 'admin';
  if (!confirm(`將 ${email} ${newRole === 'admin' ? '升級為管理員' : '降為學員'}？`)) return;
  try {
    await window.fb.setDoc(
      window.fb.doc(window.fb.db, 'whitelist', email),
      { ...entry, role: newRole },
      { merge: true }
    );
    toast(`✓ ${email} → ${newRole === 'admin' ? '管理員' : '學員'}`, 'success');
    await loadList();
  } catch (e) {
    console.error(e);
    toast('變更失敗：' + (e.message || e.code), 'error');
  }
}

init();
</script>
</body>
</html>
