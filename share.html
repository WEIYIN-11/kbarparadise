<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練功房 — 學員交易紀錄</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAVLsvNmGxSrE7Qqko3txttsbUHDaPFCys",
  authDomain: "trianingground.firebaseapp.com",
  projectId: "trianingground",
  storageBucket: "trianingground.firebasestorage.app",
  messagingSenderId: "195611785724",
  appId: "1:195611785724:web:f07a404babe21d404b1a79"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.fbHelpers = { db, doc, getDoc };
window.dispatchEvent(new Event('fb-ready'));
</script>

<style>
:root {
  --bg: #0a0e1a;
  --bg-2: #111827;
  --bg-3: #1f2937;
  --bg-4: #2a3441;
  --line: #2a3441;
  --text: #e5e7eb;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --accent: #10b981;
  --accent-2: #34d399;
  --danger: #ef4444;
  --danger-2: #f87171;
  --warn: #f59e0b;
  --info: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
  line-height: 1.5;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px;
  background: var(--bg-2);
  border-radius: 12px;
  border: 1px solid var(--line);
  margin-bottom: 20px;
}
.brand { font-size: 18px; font-weight: 700; color: var(--accent-2); display:flex;align-items:center;gap:6px;}
.who {
  text-align: right; font-size: 13px;
}
.who .name { font-weight: 700; font-size: 15px; }
.who .meta { color: var(--text-3); font-size: 11px; margin-top:2px;}

.banner-loading, .banner-error {
  padding: 30px 20px; text-align: center;
  color: var(--text-2);
}
.banner-error { color: var(--danger-2); }

h2 {
  font-size: 15px; margin: 24px 0 10px;
  color: var(--text-2); font-weight: 600;
  letter-spacing: 0.5px;
}

.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 8px;
}
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2,1fr); } }

.stat {
  background: var(--bg-2);
  border-radius: 10px;
  padding: 14px 16px;
  border: 1px solid var(--line);
}
.stat .label { font-size: 11px; color: var(--text-3); }
.stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat.win .value { color: var(--accent-2); }
.stat.lose .value { color: var(--danger-2); }

.card {
  background: var(--bg-2);
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 16px;
  margin-bottom: 14px;
  overflow-x: auto;
}

table {
  width: 100%; border-collapse: collapse; font-size: 12px;
  min-width: 540px;
}
th, td {
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
}
th { color: var(--text-3); font-weight: 500; font-size: 11px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.long  { color: var(--accent-2); font-weight: 600; }
.short { color: var(--danger-2); font-weight: 600; }
.win-amt  { color: var(--accent-2); }
.lose-amt { color: var(--danger-2); }
.pill { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; background: var(--bg-3); color: var(--text-2); }

.footer {
  margin-top: 30px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
}
.footer a { color: var(--accent-2); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">📈 練功房</div>
    <div class="who">
      <div class="name" id="owner-name">—</div>
      <div class="meta" id="owner-meta">—</div>
    </div>
  </div>

  <div id="banner" class="banner-loading">載入中…</div>

  <div id="content" style="display:none;">
    <h2>績效摘要</h2>
    <div class="stats" id="stats"></div>
    <div id="empty-note" style="display:none;color:var(--text-3);text-align:center;padding:30px;">學員尚未完成任何交易</div>

    <h2>策略 × 出場原因</h2>
    <div class="card" id="crosstab-wrap">
      <div style="font-size:11px;color:var(--text-3);">尚無資料</div>
    </div>

    <h2>交易紀錄</h2>
    <div class="card" id="trades-wrap">
      <div style="font-size:11px;color:var(--text-3);">尚無紀錄</div>
    </div>

    <h2>持倉中</h2>
    <div class="card" id="positions-wrap">
      <div style="font-size:11px;color:var(--text-3);">無未平倉部位</div>
    </div>
  </div>

  <div class="footer">
    由 <a href="/">練功房</a> 提供
  </div>
</div>

<script>
const POINT_VALUE = { NQ: 20, BTC: 1, TXF: 200 / 31 };
const fmtMoney = (n) => {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const s = abs >= 1000 ? abs.toFixed(0) : abs.toFixed(2);
  return (n < 0 ? '-$' : '$') + Number(s).toLocaleString();
};
const fmtR = (n) => (n == null || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + 'R';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = (ts) => {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleString('zh-Hant', { year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit' });
};
function showError(msg) {
  const b = document.getElementById('banner');
  b.textContent = msg;
  b.className = 'banner-error';
  document.getElementById('content').style.display = 'none';
}

async function main() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id || !/^[A-Za-z0-9]{6,32}$/.test(id)) {
    showError('連結無效');
    return;
  }
  await new Promise(r => {
    if (window.fbHelpers) r();
    else window.addEventListener('fb-ready', r, { once: true });
  });
  const { db, doc, getDoc } = window.fbHelpers;
  let snap;
  try {
    snap = await getDoc(doc(db, 'shares', id));
  } catch (e) {
    console.error(e);
    showError('讀取失敗：' + (e.message || e.code));
    return;
  }
  if (!snap.exists()) {
    showError('連結已失效或被學員撤銷');
    return;
  }
  const data = snap.data();
  render(data);
}

function render(data) {
  document.getElementById('banner').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  document.getElementById('owner-name').textContent = data.ownerName || data.ownerEmail || '—';
  const updated = data.updatedAt?.seconds ? new Date(data.updatedAt.seconds * 1000) : null;
  document.getElementById('owner-meta').textContent = updated
    ? `快照時間：${updated.toLocaleString('zh-Hant', { dateStyle: 'short', timeStyle: 'short' })}`
    : '';

  const snap = data.snapshot || {};
  const trades = Array.isArray(snap.trades) ? snap.trades : [];
  const positions = Array.isArray(snap.positions) ? snap.positions : [];
  const settings = snap.settings || { balance: 100000 };

  // Stats
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl <= 0);
  const winRate = trades.length ? (wins.length / trades.length * 100) : 0;
  const totalPnl = trades.reduce((s, t) => s + (t.pnl || 0), 0);
  const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 0;
  const rr = avgLoss > 0 ? avgWin / avgLoss : Infinity;
  const avgR = trades.length ? trades.reduce((s, t) => s + (t.rMultiple || 0), 0) / trades.length : 0;
  let curStreak = 0, maxLossStreak = 0;
  for (const t of [...trades].sort((a,b) => a.exitTime - b.exitTime)) {
    if (t.pnl <= 0) { curStreak++; if (curStreak > maxLossStreak) maxLossStreak = curStreak; }
    else curStreak = 0;
  }

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">總交易數</div><div class="value">${trades.length}</div></div>
    <div class="stat ${winRate >= 50 ? 'win' : 'lose'}"><div class="label">勝率</div><div class="value">${winRate.toFixed(1)}%</div></div>
    <div class="stat ${totalPnl >= 0 ? 'win' : 'lose'}"><div class="label">總盈虧</div><div class="value">${fmtMoney(totalPnl)}</div></div>
    <div class="stat ${rr >= 1 ? 'win' : 'lose'}"><div class="label">盈虧比 R:R</div><div class="value">${isFinite(rr) ? '1:' + rr.toFixed(2) : '∞'}</div></div>
    <div class="stat"><div class="label">平均賺</div><div class="value" style="color:var(--accent-2)">${fmtMoney(avgWin)}</div></div>
    <div class="stat"><div class="label">平均賠</div><div class="value" style="color:var(--danger-2)">${fmtMoney(avgLoss)}</div></div>
    <div class="stat ${avgR >= 0 ? 'win' : 'lose'}"><div class="label">平均 R 倍</div><div class="value">${fmtR(avgR)}</div></div>
    <div class="stat lose"><div class="label">最大連虧</div><div class="value">${maxLossStreak}</div></div>
  `;

  if (!trades.length) {
    document.getElementById('empty-note').style.display = 'block';
  }

  // Crosstab strategy × exit reason
  const strategies = [...new Set(trades.map(t => t.strategyTag || '—'))].sort();
  const reasons = [...new Set(trades.map(t => t.exitReason || '—'))].sort();
  if (strategies.length && reasons.length) {
    let html = `<table><thead><tr><th>策略</th>${reasons.map(r=>`<th class="num">${esc(r)}</th>`).join('')}<th class="num">小計</th></tr></thead><tbody>`;
    for (const s of strategies) {
      let total = 0;
      const cells = reasons.map(r => {
        const cnt = trades.filter(t => t.strategyTag === s && t.exitReason === r).length;
        total += cnt;
        return `<td class="num">${cnt || ''}</td>`;
      }).join('');
      html += `<tr><td>${esc(s)}</td>${cells}<td class="num"><strong>${total}</strong></td></tr>`;
    }
    html += '</tbody></table>';
    html += '<div style="font-size:11px;color:var(--text-3);margin-top:6px;">💡 同一策略對應「達停損 / 達停利」表示有紀律；對應「提前砍單 / 提前獲利」次數多表示紀律破口。</div>';
    document.getElementById('crosstab-wrap').innerHTML = html;
  }

  // Trades table
  if (trades.length) {
    let html = `<table><thead><tr>
      <th>標的</th><th>方向</th><th class="num">進場</th><th class="num">出場</th>
      <th class="num">盈虧</th><th class="num">R 倍</th><th>策略</th><th>出場原因</th><th>備註</th>
    </tr></thead><tbody>`;
    for (const t of trades) {
      html += `<tr>
        <td><strong>${esc(t.symbol)}</strong> <span class="pill">${esc(t.timeframe)}</span></td>
        <td class="${t.side}">${t.side === 'long' ? '多' : '空'}</td>
        <td class="num">${(+t.entryPrice).toFixed(2)}<br><span style="color:var(--text-3);font-size:10px;">${esc(fmtDT(t.entryTime))}</span></td>
        <td class="num">${(+t.exitPrice).toFixed(2)}<br><span style="color:var(--text-3);font-size:10px;">${esc(fmtDT(t.exitTime))}</span></td>
        <td class="num ${t.pnl >= 0 ? 'win-amt' : 'lose-amt'}"><strong>${fmtMoney(t.pnl)}</strong></td>
        <td class="num ${t.pnl >= 0 ? 'win-amt' : 'lose-amt'}">${fmtR(t.rMultiple)}</td>
        <td>${esc(t.strategyTag || '')}</td>
        <td>${esc(t.exitReason || '')}</td>
        <td style="max-width:200px;font-size:11px;color:var(--text-2);">${esc(t.exitNote || '')}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('trades-wrap').innerHTML = html;
  }

  // Positions
  if (positions.length) {
    let html = `<table><thead><tr>
      <th>標的</th><th>方向</th><th class="num">進場</th><th class="num">SL</th><th class="num">TP</th><th>策略</th><th>進場理由</th>
    </tr></thead><tbody>`;
    for (const p of positions) {
      html += `<tr>
        <td><strong>${esc(p.symbol)}</strong> <span class="pill">${esc(p.timeframe)}</span></td>
        <td class="${p.side}">${p.side === 'long' ? '多' : '空'}</td>
        <td class="num">${(+p.entryPrice).toFixed(2)}<br><span style="color:var(--text-3);font-size:10px;">${esc(fmtDT(p.entryTime))}</span></td>
        <td class="num lose-amt">${(+p.stopLoss).toFixed(2)}</td>
        <td class="num win-amt">${(+p.takeProfit).toFixed(2)}</td>
        <td>${esc(p.strategyTag || '')}</td>
        <td style="max-width:300px;font-size:11px;color:var(--text-2);">${esc(p.entryReason || '')}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('positions-wrap').innerHTML = html;
  }
}

main();
</script>
</body>
</html>
